# Netlify config for scribe.nanthai.tech (matches nanthai.tech hosting).
# Deploy by connecting this repo with base directory "website"; nothing here deploys by itself.

[build]
  base = "website"
  command = "npm run build"
  publish = "dist"
  # Netlify runs this from the base directory, so "." is website/: skip the build
  # when nothing here changed since the last deploy (exit 0 = skip).
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[build.environment]
  NODE_VERSION = "22"

# Static site: long cache for hashed assets and fonts, short for HTML.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # No analytics, no third parties: everything is served from this origin.
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'"

# Sparkle reads the appcast; serve it as XML, not as a generic file.
[[headers]]
  for = "/appcast.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=600, must-revalidate"

[[headers]]
  for = "/sitemap-index.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
